<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Pólizas ARESS</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para procesar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librerías de Lógica (CSV, PDF, Gráficos) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Fuentes y estilos globales */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #e0f2fe 0%, #f1f5f9 100%); background-attachment: fixed; }
        
        /* Animaciones suaves */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        /* Estilos personalizados para scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // --- CONSTANTES ---
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQej8ld2uBbpVIJ6rrF2VPyLMxEvcxDfupDvAU6kVG1cKC-oA7NLHZFUB8t7IX31iQiV3FLVv7LuCfL/pub?gid=0&single=true&output=csv";
        
        // Función para normalizar texto (quitar tildes, minúsculas)
        const norm = (s) => (s || "").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        // --- PANTALLA DE LOGIN ---
            const LoginScreen = ({ onLogin }) => {
            const [user, setUser] = useState("");
            const [pass, setPass] = useState("");
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [showPass, setShowPass] = useState(false); // Estado para el ojo

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError("");
                
                try {
                    const hashedAttempt = await hashString(pass); 
                    const VALID_HASH = "77a363b5f74484fa71a605a19e2bbe4459a4f0f867e7be896f174fcc299d25d8";

                    if (user.toLowerCase() === "administrador" && hashedAttempt === VALID_HASH) {
                        onLogin(user);
                    } else {
                        setError("Usuario o contraseña incorrectos");
                        setLoading(false);
                    }
                } catch (err) {
                    setError("Error de seguridad");
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 bg-cover bg-center" style={{backgroundImage: "url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80')"}}>
                    <div className="absolute inset-0 bg-blue-900/80 backdrop-blur-sm"></div>
                    <div className="relative bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-blue-600">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-slate-800">Bienvenido</h1>
                            <p className="text-slate-500 mt-2">Sistema de Consulta de Pólizas</p>
                        </div>

                        {error && (
                            <div className="mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm border border-red-200 text-center font-medium">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-1">Usuario</label>
                                <input 
                                    type="text" 
                                    required
                                    className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none transition-all"
                                    placeholder="Nombre de usuario"
                                    value={user}
                                    onChange={(e) => setUser(e.target.value)}
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                                <div className="relative">
                                    <input 
                                        type={showPass ? "text" : "password"} 
                                        required
                                        className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none transition-all"
                                        placeholder="••••••••"
                                        value={pass}
                                        onChange={(e) => setPass(e.target.value)}
                                    />
                                    {/* Botón del Ojo */}
                                    <button 
                                        type="button"
                                        onClick={() => setShowPass(!showPass)}
                                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition-colors p-1"
                                    >
                                        {showPass ? (
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                                        ) : (
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                        )}
                                    </button>
                                </div>
                            </div>
                            <button 
                                type="submit"
                                disabled={loading}
                                className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 rounded-lg transition-all disabled:opacity-50 active:scale-[0.98]"
                            >
                                {loading ? "Verificando..." : "Iniciar Sesión"}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- TARJETAS DE INDICADORES (DASHBOARD) ---
            const StatCard = ({ title, value, color, icon, onClick, active }) => {
            const colorClasses = {
                gray: { bg: 'bg-slate-50', border: 'border-slate-200', text: 'text-slate-600', iconBg: 'bg-slate-100' },
                green: { bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-600', iconBg: 'bg-emerald-100' },
                blue: { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-600', iconBg: 'bg-blue-100' },
                red: { bg: 'bg-rose-50', border: 'border-rose-200', text: 'text-rose-600', iconBg: 'bg-rose-100' },
                emerald: { bg: 'bg-teal-50', border: 'border-teal-200', text: 'text-teal-600', iconBg: 'bg-teal-100' },
                yellow: { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-600', iconBg: 'bg-amber-100' },
                purple: { bg: 'bg-purple-50', border: 'border-purple-200', text: 'text-purple-600', iconBg: 'bg-purple-100' },
            };
            const c = colorClasses[color] || colorClasses.gray;

            return (
                <div 
                    onClick={onClick}
                    className={`relative overflow-hidden rounded-xl p-5 cursor-pointer transition-all duration-300 border ${active ? `ring-2 ring-offset-1 ring-${color}-500 shadow-md transform -translate-y-1` : 'hover:shadow-md hover:-translate-y-0.5 border-slate-200 bg-white'}`}
                >
                    <div className="flex justify-between items-start z-10 relative">
                        <div>
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">{title}</p>
                            <h3 className="text-2xl font-black text-slate-800 mt-1">{value}</h3>
                        </div>
                        {/* Contenedor de icono unificado y pequeño */}
                        <div className={`p-1.5 rounded-lg ${c.iconBg} ${c.text}`}>
                            {icon === "layers" && <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>}
                            {icon === "check-circle" && <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>}
                            {icon === "clock" && <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>}
                            {icon === "alert-circle" && <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>}
                            {icon === "dollar-sign" && <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>}
                            {icon === "alert-triangle" && <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>}
                        </div>
                    </div>
                    <div className={`absolute bottom-0 left-0 h-1 bg-${color}-500 transition-all duration-500`} style={{ width: active ? '100%' : '0%' }}></div>
                </div>
            );
        };

        // --- MODAL DETALLE CON GENERACIÓN DE PDF ---
        const DetailModal = ({ isOpen, onClose, data }) => {
            if (!isOpen || !data) return null;

            const handleDownloadPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: "pt", format: "A4" });
                const width = doc.internal.pageSize.getWidth();
                
                // Header Azul Corporativo
                doc.setFillColor(0, 88, 163);
                doc.rect(0, 0, width, 70, "F");
                
                doc.setFontSize(18);
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.text(`Reporte de Pólizas`, 40, 45);
                
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                doc.text(`Contrato No. ${data[0]["No. contrato"] || "S/N"}`, 40, 95);
                doc.text(`Fecha Impresión: ${new Date().toLocaleDateString()}`, width - 40, 95, { align: 'right' });

                // Generación de tabla usando AutoTable
                const tableBody = data.map(p => {
                    const pago = norm(p["Pago"]) === "si" ? "PAGADO" : "PENDIENTE";
                    return [
                        p["Certificado"] || "-",
                        p["Número de póliza"] || "-",
                        p["Compañía"] || "-",
                        `${p["Vigencia inicio"] || ""} - ${p["Vigencia fin"] || ""}`,
                        p["Valor póliza"] || "$0",
                        pago,
                        p["Estado"] || "-"
                    ];
                });

                doc.autoTable({
                    startY: 110,
                    head: [['Cert.', 'Póliza', 'Compañía', 'Vigencia', 'Valor', 'Pago', 'Estado']],
                    body: tableBody,
                    theme: 'grid',
                    headStyles: { fillColor: [0, 88, 163], textColor: 255, fontStyle: 'bold' },
                    styles: { fontSize: 8, cellPadding: 6 },
                    alternateRowStyles: { fillColor: [245, 247, 250] },
                    columnStyles: {
                        5: { fontStyle: 'bold', textColor: [50, 50, 50] }
                    }
                });

                doc.save(`Reporte_Contrato_${data[0]["No. contrato"]}.pdf`);
            };

            const handleDownloadCSV = () => {
                const csv = Papa.unparse(data);
                const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Reporte_${data[0]["No. contrato"]}.csv`;
                link.click();
            }

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
                    <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-4xl flex flex-col max-h-[90vh] animate-fade-in overflow-hidden">
                        
                        {/* Modal Header */}
                        <div className="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800">Detalle de Contrato</h2>
                                <div className="flex items-center gap-2 mt-1">
                                    <span className="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded font-bold">CONTRATO</span>
                                    <span className="text-slate-500 font-mono text-sm">{data[0]["No. contrato"]}</span>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full text-slate-400 hover:text-slate-600 transition">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>                            
                            </button>
                        </div>

                        {/* Modal Body */}
                        <div className="p-8 overflow-y-auto bg-slate-50/30 grow space-y-4 custom-scrollbar">
                            {data.map((p, idx) => {
                                const ramoLower = (p["Ramo"] || "").toLowerCase();
                                // Lógica de iconos y colores según el ramo
                                const isRCCUM = ramoLower.includes("rccum");
                                const isCUM = ramoLower.includes("cum") && !isRCCUM;

                                return (
                                    <div key={idx} className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex justify-between items-start mb-4">
                                            <div className="flex items-center gap-3">
                                                <div className={`p-2 rounded-lg ${
                                                    isRCCUM ? 'bg-purple-100 text-purple-600' : 
                                                    isCUM ? 'bg-sky-100 text-sky-600' : 
                                                    'bg-slate-100 text-slate-600'
                                                }`}>
                                                    {isRCCUM || isCUM ? (
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                                            <polyline points="9 11 12 14 15 11"></polyline>
                                                        </svg>
                                                    ) : (
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                            <polyline points="14 2 14 8 20 8"></polyline>
                                                            <line x1="16" y1="13" x2="8" y2="13"></line>
                                                            <line x1="16" y1="17" x2="8" y2="17"></line>
                                                            <polyline points="10 9 9 9 8 9"></polyline>
                                                        </svg>
                                                    )}                                                
                                                    </div>
                                                <div>
                                                    <h3 className="font-bold text-slate-800 text-lg">Certificado {p["Certificado"]}</h3>
                                                    <p className="text-xs text-slate-400 font-medium uppercase">{p["Ramo"]}</p>
                                                </div>
                                            </div>
                                            <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold border ${norm(p["Pago"]) === "si" ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'}`}>
                                                {norm(p["Pago"]) === "si" ? (
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                                    </svg>
                                                ) : (
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                                        <circle cx="12" cy="12" r="10"></circle>
                                                        <line x1="12" y1="8" x2="12" y2="12"></line>
                                                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                                    </svg>
                                                )}                                                
                                                {norm(p["Pago"]) === "si" ? 'PAGADO' : 'PENDIENTE'}
                                            </div>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm">
                                            <div>
                                                <span className="block text-xs font-semibold text-slate-400 uppercase mb-1">Número de póliza</span>
                                                <div className="font-medium text-slate-700">{p["Número de póliza"] || "N/A"}</div>
                                            </div>
                                            <div>
                                                <span className="block text-xs font-semibold text-slate-400 uppercase mb-1">Compañía Aseguradora</span>
                                                <div className="font-medium text-slate-700">{p["Compañía"] || "N/A"}</div>
                                            </div>
                                            <div>
                                                <span className="block text-xs font-semibold text-slate-400 uppercase mb-1">Valor póliza</span>
                                                <div className="font-medium text-slate-700">{p["Valor póliza"] || "$0"}</div>
                                            </div>
                                            <div className="md:col-span-2">
                                                <span className="block text-xs font-semibold text-slate-400 uppercase mb-1">Vigencia</span>
                                                <div className="font-medium text-slate-700 flex items-center gap-2">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-slate-400">
                                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                                </svg>                                                    
                                                {p["Vigencia inicio"]} <span className="text-slate-300">➜</span> {p["Vigencia fin"]}
                                                </div>
                                            </div>
                                            <div>
                                                <span className="block text-xs font-semibold text-slate-400 uppercase mb-1">Estado</span>
                                                <span className={`inline-block px-2 py-0.5 rounded text-xs font-bold border ${
                                                    norm(p["Estado"]) === 'expedida' ? 'bg-green-50 text-green-700 border-green-200' : 'bg-slate-100 text-slate-600 border-slate-200'
                                                }`}>
                                                    {p["Estado"]}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Modal Footer */}
                        <div className="p-6 border-t border-slate-100 bg-white flex justify-between items-center shrink-0">
                            <span className="text-xs text-slate-400">Mostrando {data.length} certificado(s)</span>
                            <div className="flex gap-3">
                                <button onClick={handleDownloadCSV} className="px-4 py-2.5 text-slate-700 hover:bg-slate-50 border border-slate-200 rounded-lg font-semibold text-sm flex items-center gap-2 transition-colors">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-green-600">
                                        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"></path>
                                    </svg> Exportar CSV
                                </button>
                                <button onClick={handleDownloadPDF} className="px-4 py-2.5 bg-blue-700 hover:bg-blue-800 text-white rounded-lg font-semibold text-sm shadow-md hover:shadow-lg flex items-center gap-2 transition-all">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="12" y1="18" x2="12" y2="12"></line>
                                    <polyline points="9 15 12 18 15 15"></polyline>
                                </svg>Generar PDF
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD GRÁFICO ---
        const DashboardModal = ({ isOpen, onClose, stats }) => {
            if (!isOpen) return null;

            useEffect(() => {
                const timer = setTimeout(() => {
                    const configs = [
                        { id: 'chart-exp', data: [stats.expedidos, stats.total - stats.expedidos], color: '#10b981' }, // Verde
                        { id: 'chart-pend', data: [stats.sinExpedir + stats.enExpedicion, stats.expedidos], color: '#f43f5e' }, // Rojo
                        { id: 'chart-pag', data: [stats.pagados, stats.noPagados], color: '#3b82f6' }, // Azul
                        { id: 'chart-nopag', data: [stats.noPagados, stats.pagados], color: '#f59e0b' }, // Amarillo
                    ];

                    configs.forEach(cfg => {
                        const ctx = document.getElementById(cfg.id);
                        if (ctx) {
                            const existingChart = Chart.getChart(cfg.id);
                            if (existingChart) existingChart.destroy();

                            new Chart(ctx, {
                                type: 'doughnut',
                                data: {
                                    labels: ['Si', 'No'],
                                    datasets: [{
                                        data: cfg.data,
                                        backgroundColor: [cfg.color, '#f1f5f9'],
                                        borderWidth: 0,
                                        hoverOffset: 4
                                    }]
                                },
                                options: {
                                    cutout: '80%',
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                                    animation: { animateScale: true, animateRotate: true }
                                }
                            });
                        }
                    });
                }, 150);
                return () => clearTimeout(timer);
            }, [isOpen, stats]);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-5xl overflow-hidden animate-fade-in">
                        <div className="px-8 py-6 border-b border-slate-100 flex justify-between items-center">
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">Tablero de Control</h2>
                                <p className="text-sm text-slate-500">Indicadores de gestión con porcentajes</p>
                            </div>
                            <button onClick={onClose}>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>                                
                            </button>
                        </div>
                        <div className="p-8 grid grid-cols-1 md:grid-cols-4 gap-8">
                            {[
                                { title: 'Expedidos', val: stats.expedidos, id: 'chart-exp', color: 'text-emerald-600' },
                                { title: 'Pendientes', val: stats.sinExpedir + stats.enExpedicion, id: 'chart-pend', color: 'text-rose-600' },
                                { title: 'Pagados', val: stats.pagados, id: 'chart-pag', color: 'text-blue-600' },
                                { title: 'Sin Pago', val: stats.noPagados, id: 'chart-nopag', color: 'text-amber-500' }
                            ].map((item, i) => (
                                <div key={i} className="flex flex-col items-center">
                                    <div className="relative w-40 h-40 mb-2">
                                        <canvas id={item.id}></canvas>
                                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                            <span className={`text-3xl font-black ${item.color}`}>{item.val}</span>
                                            <span className="text-xs text-slate-400 font-medium uppercase">{item.title}</span>
                                        </div>
                                    </div>
                                    {/* Nueva línea de porcentaje y cantidad */}
                                    <div className="text-center">
                                        <p className="text-lg font-bold text-slate-800">
                                            {stats.total > 0 ? ((item.val / stats.total) * 100).toFixed(1) : 0}% 
                                            <span className="text-slate-400 ml-1 text-sm font-medium">({item.val})</span>
                                        </p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        async function hashString(str) {
        const encoder = new TextEncoder();
        const data = encoder.encode(str);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hash))
            .map(b => b.toString(16).padStart(2, '0'))
            .join('');
        }

        // --- APLICACIÓN PRINCIPAL ---
        const App = () => {
            const [session, setSession] = useState(() => localStorage.getItem("isLoggedIn") === "true");
            const [data, setData] = useState([]);
            const [search, setSearch] = useState("");
            const [filter, setFilter] = useState([]);
            const [selectedGroup, setSelectedGroup] = useState(null);
            const [showDash, setShowDash] = useState(false);
            const [loading, setLoading] = useState(true);
            const [visibleCount, setVisibleCount] = useState(20);

            useEffect(() => {
                setVisibleCount(20);
            }, [filter, search]);

            // Carga de datos
            useEffect(() => {
                if (session) {
                    Papa.parse(SHEET_URL, {
                        download: true, header: true, skipEmptyLines: true,
                        complete: (res) => {
                            setData(res.data.filter(r => r["No. contrato"]));
                            setLoading(false);
                        }
                    });
                }
            }, [session]);

            // Lógica de Negocio (Filtrado y Agrupación)
            const groups = useMemo(() => {
                const g = {};
                const q = search.toLowerCase();
                const list = data.filter(p => 
                    !search || (p["Identificación"]||"").toLowerCase().includes(q) || (p["No. contrato"]||"").toLowerCase().includes(q)
                );
                
                list.forEach(p => {
                    const key = `${p["No. contrato"]}__${p["Cliente"]}`;
                    if (!g[key]) g[key] = [];
                    g[key].push(p);
                });
                return g;
            }, [data, search]);

            const stats = useMemo(() => {
                let total=0, expedidos=0, enExpedicion=0, sinExpedir=0, pagados=0, noPagados=0;
                Object.values(groups).forEach(g => {
                    total++;
                    const estado = norm(g[0]["Estado"]);
                    const pagos = g.map(r => norm(r["Pago"]));
                    
                    if (estado === "expedida") expedidos++;
                    else if (estado === "en expedicion") enExpedicion++;
                    else if (estado === "sin expedir") sinExpedir++;

                    if (pagos.every(p => p === "si")) pagados++;
                    else noPagados++;
                });
                return { total, expedidos, enExpedicion, sinExpedir, pagados, noPagados };
            }, [groups]);

            const filteredGroups = useMemo(() => {
                try {
                    const entries = Object.entries(groups || {});
                    if (entries.length === 0) return [];

                    let filtered = entries;

                    // Filtro de búsqueda
                    if (search) {
                        const s = search.toLowerCase();
                        filtered = filtered.filter(([key, g]) => {
                            const row = g[0];
                            return (row["No. contrato"] || "").toLowerCase().includes(s) || 
                                   (row["Cliente"] || "").toLowerCase().includes(s) || 
                                   (row["Identificación"] || "").toLowerCase().includes(s);
                        });
                    }

                    // Filtros de botones (Estado, Pago, Ingenio)
                    if (Array.isArray(filter) && filter.length > 0) {
                        filtered = filtered.filter(([_, g]) => {
                            const row = g[0] || {};
                            const estadoRow = norm(row["Estado"] || "");
                            const isPaid = g.every(p => norm(p["Pago"] || "") === "si");

                            const matchesEstado = !filter.some(f => ["expedida", "en expedicion", "sin expedir"].includes(f)) || (
                                (filter.includes("expedida") && estadoRow === "expedida") ||
                                (filter.includes("en expedicion") && (estadoRow.includes("tramite") || estadoRow.includes("expedicion"))) ||
                                (filter.includes("sin expedir") && estadoRow.includes("sin"))
                            );

                            const matchesPago = !filter.some(f => ["pagados", "no pagados"].includes(f)) || (
                                (filter.includes("pagados") && isPaid) ||
                                (filter.includes("no pagados") && !isPaid)
                            );

                            const ingenioFilters = filter.filter(f => !["expedida", "en expedicion", "sin expedir", "pagados", "no pagados"].includes(f));
                            const matchesIngenio = ingenioFilters.length === 0 || ingenioFilters.includes(row["Ingenio"]);

                            return matchesEstado && matchesPago && matchesIngenio;
                        });
                    }

                    return filtered.slice(0, visibleCount || 20);
                } catch (err) {
                    console.error("Error en filtrado:", err);
                    return [];
                }
            }, [groups, filter, search, visibleCount]);

            // Nueva función para manejar múltiples filtros
            const toggleFilter = (f) => {
                setFilter(prev => {
                    const current = Array.isArray(prev) ? prev : [];
                    return current.includes(f) 
                        ? current.filter(item => item !== f) 
                        : [...current, f];
                });
            };

            if (!session) return <LoginScreen onLogin={(userData) => { 
                localStorage.setItem("isLoggedIn", "true"); 
                setSession(true); 
            }} />;

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm/50 backdrop-blur-md bg-white/90">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-6">
                                    <div className="flex items-center gap-4">
                                        <img src="./incauca.png" alt="Incauca" className="h-14 object-contain" onError={(e) => e.target.style.display='none'} />
                                        <img src="./providencia.jpg" alt="Providencia" className="h-14 object-contain" onError={(e) => e.target.style.display='none'} />
                                        <img src="./sucroal.webp" alt="Sucroal" className="h-14 object-contain" onError={(e) => e.target.style.display='none'} />
                                    </div>
                                <div className="h-8 w-px bg-slate-200 hidden md:block"></div>
                                <div>
                                    <h1 className="text-lg font-bold text-slate-800 leading-tight">Consulta de Pólizas</h1>
                                    <p className="text-xs text-slate-500">Portal Corporativo</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <img src="./aress.jpeg" alt="Aress" className="h-10 object-contain hidden sm:block" onError={(e) => e.target.style.display='none'} />
                                <button onClick={() => setShowDash(true)} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow hover:bg-slate-700 transition flex items-center gap-2">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                                    <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                                    </svg> Indicadores
                                </button>
                                <button onClick={() => { localStorage.clear(); setSession(false); }} className="p-2 text-slate-400 hover:text-red-500 transition rounded-full hover:bg-red-50">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main */}
                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                        
                    {/* Search */}
                    <div className="flex flex-col md:flex-row gap-3 max-w-2xl mx-auto w-full mb-6">
                        <div className="relative flex-1 group">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>                           
                                <input type="text" className="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 shadow-sm transition-all text-sm"
                                placeholder="Busca por NO. contrato y/o Identificación del cliente"
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                            />
                        </div>
                        
                        {/* Botón con tu estilo Rojo original y lógica corregida */}
                        {(filter.length > 0 || search !== "") && (
                                <button 
                                    type="button" 
                                    onClick={() => {
                                        setFilter([]);
                                        setSearch("");
                                        if (typeof setVisibleCount === 'function') setVisibleCount(20);
                                    }} 
                                    className="px-4 py-2.5 rounded-xl bg-red-600 text-white text-xs font-bold hover:bg-red-700 transition-all flex items-center justify-center gap-2 shadow-md active:scale-95 animate-fade-in"
                                >
                                    {/* Icono SVG Directo: No depende de librerías */}
                                    <svg 
                                        xmlns="http://www.w3.org/2000/svg" 
                                        width="16" 
                                        height="16" 
                                        viewBox="0 0 24 24" 
                                        fill="none" 
                                        stroke="currentColor" 
                                        strokeWidth="2.5" 
                                        strokeLinecap="round" 
                                        strokeLinejoin="round"
                                    >
                                        <path d="M3 6h18"></path>
                                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                                        <line x1="10" y1="11" x2="10" y2="17"></line>
                                        <line x1="14" y1="11" x2="14" y2="17"></line>
                                    </svg>
                                    Limpiar Filtros
                                </button>
                            )}
                    </div>

                        {/* Stats Grid */}
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                            <StatCard title="Total" value={stats.total} color="blue" icon="layers" onClick={() => setFilter([])} active={filter.length === 0} />
                            <StatCard title="Expedidos" value={stats.expedidos} color="green" icon="check-circle" onClick={() => toggleFilter("expedida")} active={filter.includes("expedida")} />
                            <StatCard title="En Trámite" value={stats.enExpedicion} color="purple" icon="clock" onClick={() => toggleFilter("en expedicion")} active={filter.includes("en expedicion")} />
                            <StatCard title="Sin Expedir" value={stats.sinExpedir} color="red" icon="alert-circle" onClick={() => toggleFilter("sin expedir")} active={filter.includes("sin expedir")} />
                            <StatCard title="Pagados" value={stats.pagados} color="emerald" icon="dollar-sign" onClick={() => toggleFilter("pagados")} active={filter.includes("pagados")} />
                            <StatCard title="Pendientes" value={stats.noPagados} color="yellow" icon="alert-triangle" onClick={() => toggleFilter("no pagados")} active={filter.includes("no pagados")} />
                        </div>

                        {/* SECCIÓN DE INGENIOS (LIMPIA) */}
                        <div className="p-4 bg-white/60 rounded-2xl border border-slate-200 backdrop-blur-sm mb-6 shadow-sm">
                            <div className="flex items-center gap-2 mb-3">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-slate-400">
                                <path d="M2 20V9l4-2v13"></path>
                                <path d="M18 20V7l4-2v15"></path>
                                <path d="M14 20V5l4 2v13"></path>
                                <path d="M10 20V11l4-2v11"></path>
                                <path d="M6 20V13l4-2v9"></path>
                            </svg>                                
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Filtrar por Ingenio:</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {[...new Set(data.map(item => item["Ingenio"]))].filter(Boolean).sort().map(ing => (
                                    <button 
                                        key={ing} 
                                        onClick={() => toggleFilter(ing)}
                                        className={`px-4 py-2 rounded-xl text-[11px] font-bold transition-all border ${
                                            filter.includes(ing) 
                                            ? 'bg-slate-700 text-white border-transparent shadow-md scale-105' 
                                            : 'bg-white text-slate-500 border-slate-200 hover:border-slate-400 hover:bg-slate-50'
                                        }`}
                                    >
                                        {ing}
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        {/* Table */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            {loading ? (
                                <div className="p-20 text-center text-slate-500">
                                    <div className="animate-spin inline-block w-8 h-8 border-4 border-current border-t-transparent rounded-full mb-3 text-blue-600"></div>
                                    <p className="font-medium">Sincronizando con base de datos...</p>
                                </div>
                            ) : filteredGroups.length === 0 ? (
                                <div className="p-20 text-center text-slate-400">
                                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" className="mx-auto mb-4 opacity-30">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="M21 21l-4.35-4.35"></path>
                                    <path d="M11 5v6"></path>
                                    <path d="M8 8h6"></path>
                                </svg>                                    
                                <p className="text-lg font-medium">No se encontraron registros</p>
                                    <p className="text-sm mt-1">Intenta ajustar los filtros o la búsqueda</p>
                                </div>
                            ) : (
                                <>
                                    <div className="overflow-x-auto">
                                        <table className="min-w-full divide-y divide-slate-100">
                                            <thead className="bg-slate-50 text-slate-500">
                                                <tr>
                                                    <th className="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Contrato</th>
                                                    <th className="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Identificación</th>
                                                    <th className="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Cliente</th>
                                                    <th className="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Ingenio</th>
                                                    <th className="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Área</th>
                                                    <th className="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Pagos</th>
                                                    <th className="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider">Estado</th>
                                                    <th className="px-6 py-4"></th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-slate-50" style={{ contentVisibility: 'auto' }}>
                                                {filteredGroups.map(([key, group], idx) => {
                                                    const row = group[0];
                                                    const isPaid = group.every(p => (p["Pago"] || "").toLowerCase().includes("si"));
                                                    
                                                    return (
                                                        <tr key={idx} onClick={() => setSelectedGroup(group)} className="hover:bg-blue-50/40 transition-colors cursor-pointer group">
                                                            <td className="px-6 py-4 text-sm font-bold text-blue-600">{row["No. contrato"]}</td>
                                                            <td className="px-6 py-4 text-sm text-slate-500 font-mono bg-slate-50/50 rounded">{row["Identificación"]}</td>
                                                            <td className="px-6 py-4 text-sm text-slate-700 font-medium">{row["Cliente"]}</td>
                                                            <td className="px-6 py-4 text-sm text-slate-700 font-medium">{row["Ingenio"]}</td>
                                                            <td className="px-6 py-4 text-sm text-slate-500">{row["Área"]}</td>
                                                            <td className="px-6 py-4 text-center">
                                                                {isPaid ? (
                                                                    <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">Al día</span>
                                                                ) : (
                                                                    <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700">Pendiente</span>
                                                                )}
                                                            </td>
                                                            <td className="px-6 py-4 text-center">
                                                                <span className={`inline-block px-3 py-1 rounded-md text-xs font-bold border ${
                                                                    norm(row["Estado"]) === 'expedida' ? 'bg-green-50 text-green-700 border-green-200' : 
                                                                    norm(row["Estado"]) === 'sin expedir' ? 'bg-red-50 text-red-700 border-red-200' :
                                                                    'bg-blue-50 text-blue-700 border-blue-200'
                                                                }`}>
                                                                    {row["Estado"]}
                                                                </span>
                                                            </td>
                                                            <td className="px-6 py-4 text-right text-slate-300 group-hover:text-blue-500 font-bold">→</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>

                                    {/* PASO 3: El botón "Cargar más" dentro de la sección de resultados */}
                                    {filteredGroups.length >= visibleCount && (
                                        <div className="p-6 border-t border-slate-100 bg-slate-50/50 flex justify-center">
                                            <button 
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    setVisibleCount(prev => prev + 20);
                                                }}
                                                className="flex items-center gap-2 px-8 py-3 bg-white border-2 border-slate-200 text-slate-600 font-bold rounded-xl hover:border-blue-500 hover:text-blue-500 transition-all shadow-sm active:scale-95 group"
                                            >
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="group-hover:rotate-90 transition-transform">
                                                <circle cx="12" cy="12" r="10"></circle>
                                                <line x1="12" y1="8" x2="12" y2="16"></line>
                                                <line x1="8" y1="12" x2="16" y2="12"></line>
                                            </svg>Cargar 20 registros más
                                            </button>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </main>

                    <DetailModal isOpen={!!selectedGroup} onClose={() => setSelectedGroup(null)} data={selectedGroup} />
                    <DashboardModal isOpen={showDash} onClose={() => setShowDash(false)} stats={stats} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
